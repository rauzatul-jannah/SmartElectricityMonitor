<!doctype html>
<html>
  <head>
    <title>Add Appliance - Smart Electricity Monitor</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7f9;
        margin: 0;
        padding: 40px;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
      }

      label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #168aad;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #126782;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>⚡ Add Appliance</h1>

      <form method="POST">
        {% csrf_token %} {{ form.as_p }}

        <button type="submit">Add Appliance</button>
      </form>

      <a class="back" href="{% url 'appliance_list' %}"> View My Appliances </a>
    </div>
  </body>
</html>
